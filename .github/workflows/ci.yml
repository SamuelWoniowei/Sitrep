name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI can read the code and nothing else. No secrets are used.
permissions:
  contents: read

jobs:
  test:
    name: Tests, lints and audits
    runs-on: ubuntu-24.04
    steps:
      # Every action is pinned to a full commit SHA so a hijacked tag can't
      # inject code into the build. Dependabot keeps the pins up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: src-tauri

      - name: UI install, tests, typecheck, build
        run: |
          npm ci
          npm test
          npm run build

      - name: npm audit
        run: npm audit --audit-level=moderate

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo audit
        working-directory: src-tauri
        run: |
          cargo install cargo-audit --locked
          cargo audit

  windows-build:
    name: Windows build check (unsigned test build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Rust tests on Windows
        working-directory: src-tauri
        run: cargo test --locked
      # Test builds are never update-signed; only the manual Release workflow signs.
      - name: Build installer
        run: npx tauri build --config src-tauri/tauri.ci.conf.json
      - name: Print SHA-256 of installer
        shell: pwsh
        run: Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Get-FileHash -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sitrep-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
