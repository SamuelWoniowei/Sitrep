name: Release

# Push a tag like v0.1.0 to build the Windows installer and publish a draft release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Tests before release
        working-directory: src-tauri
        run: cargo test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Sitrep ${{ github.ref_name }}'
          releaseBody: 'Download the -setup.exe below. The installer is not code-signed yet, so Windows SmartScreen may warn: choose More info → Run anyway. See README for the optional local AI setup.'
          releaseDraft: true
          prerelease: false
